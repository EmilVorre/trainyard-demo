app:
  domain: preview.vorre.dev
 
ingress:
  tls: true
  class: nginx
 
label: preview
 
services:
  - name: demo-multi-service
    build:
      context: demo-multi-service
      dockerfile: Dockerfile
    port: 8080
    public: true
    subdomain: "pr-{number}"
    replicas: 1
    resources:
      limits:
        cpu: "250m"
        memory: "256Mi"
    env:
      - name: POSTGRES_HOST
        value: "db"
      - name: POSTGRES_DB
        value: "trainyard"
      - name: POSTGRES_USER
        value: "trainyard"
      - name: POSTGRES_PASSWORD
        value: "trainyard"
      - name: DJANGO_SECRET_KEY
        value: "trainyard-preview-secret"
    dependsOn:
      - migrate
 
  - name: db
    image: postgres:16-alpine
    port: 5432
    public: false
    replicas: 1
    resources:
      limits:
        cpu: "250m"
        memory: "256Mi"
    env:
      - name: POSTGRES_DB
        value: "trainyard"
      - name: POSTGRES_USER
        value: "trainyard"
      - name: POSTGRES_PASSWORD
        value: "trainyard"
    dependsOn: []
 
jobs:
  - name: migrate
    build:
      context: demo-multi-service
      dockerfile: Dockerfile.migrate
    env:
      - name: POSTGRES_HOST
        value: "db"
      - name: POSTGRES_DB
        value: "trainyard"
      - name: POSTGRES_USER
        value: "trainyard"
      - name: POSTGRES_PASSWORD
        value: "trainyard"
      - name: DJANGO_SECRET_KEY
        value: "trainyard-preview-secret"
    dependsOn:
      - db
 